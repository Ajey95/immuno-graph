name: Publish container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Container version tag
        required: true
        default: 0.2.0

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e "if (require('./package.json').version !== process.env.RELEASE_VERSION) process.exit(1)"
      - run: npm ci
      - run: npm run check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ajey95/immuno-graph:${{ inputs.version }}
            ghcr.io/ajey95/immuno-graph:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Ajey95/immuno-graph
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
      - name: Smoke test the published container
        env:
          IMMUNOGRAPH_SMOKE_API_KEY: 0123456789abcdef0123456789abcdef
        run: |
          docker pull ghcr.io/ajey95/immuno-graph:${{ inputs.version }}
          docker run -d --name immunograph-smoke -p 127.0.0.1:3000:3000 \
            -e IMMUNOGRAPH_API_KEY="$IMMUNOGRAPH_SMOKE_API_KEY" \
            -e IMMUNOGRAPH_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e IMMUNOGRAPH_ALLOWED_ORIGINS=localhost,127.0.0.1 \
            ghcr.io/ajey95/immuno-graph:${{ inputs.version }}
          node scripts/smoke-container.mjs
      - name: Container logs
        if: failure()
        run: docker logs immunograph-smoke || true
      - name: Stop smoke container
        if: always()
        run: docker rm -f immunograph-smoke || true
